spring:
  application:
    name: cloud-bridge-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cloud_bridge
    username: cloudbridge
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  data:
    elasticsearch:
      client:
        reactive:
          endpoints: ${SPRING_ELASTICSEARCH_URIS:localhost:9200}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      repositories:
        enabled: false
    neo4j:
      repositories:
        enabled: false
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:password} 

es:
  url: ${ES_URL:http://localhost:9200}

ai:
  api:
    url: ${AI_API_URL:https://api.momagpt.com/v1/chat/completions}
    key: ${AI_API_KEY:ENtIovRRbQEFQHhovo65863dA_YjaSwg22Q-FK3nGEk}
    model: ${AI_API_MODEL:ZHIPU/GLM-5.2}
    embedding-url: ${AI_EMBEDDING_URL:https://api.momagpt.com/v1/embeddings}
    embedding-key: ${AI_EMBEDDING_KEY:ENtIovRRbQEFQHhovo65863dA_YjaSwg22Q-FK3nGEk}
    embedding-model: ${AI_EMBEDDING_MODEL:ZHIPU/GLM-5.2}
  agent:
    # Agent 编排配置
    max-iterations: 8          # 最大工具调用轮数
    timeout-seconds: 120       # 超时时间
    model: ${AI_AGENT_MODEL:ZHIPU/GLM-5.2}  # Agent 编排专用模型，不配置则回退使用 ai.api.model
    temperature: 0.1           # 工具调用时使用低温度确保可靠性
    max-tokens: 2048           # 单次响应最大 token 数

file:
  upload-dir: uploads

server:
  port: 8080

logging:
  file:
    name: backend.log
  level:
    root: INFO
    com.cloudbridge: DEBUG
    org.neo4j: OFF
    org.springframework.data.neo4j: OFF
