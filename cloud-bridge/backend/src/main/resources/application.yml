spring:
  application:
    name: cloud-bridge-backend
  datasource:
    # Use H2 for MVP if Docker is not available
    url: jdbc:h2:file:./data/cloud_bridge;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  data:
    elasticsearch:
      client:
        reactive:
          endpoints: ${SPRING_ELASTICSEARCH_URIS:localhost:9200}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      repositories:
        enabled: false
    neo4j:
      repositories:
        enabled: false
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:password} 

es:
  url: ${ES_URL:http://localhost:9200}

ai:
  api:
    # NVIDIA AI Foundation API (OpenAI兼容格式)
    # 注册地址: https://build.nvidia.com/
    # 免费额度: 每月10000次免费调用 (Free Tier)
    # 免费模型列表 (带Free Points):
    # - nvidia/nemotron-mini-4b-instruct (完全免费)
    # - meta/llama3-8b-instruct (免费额度)
    # - meta/llama3.1-8b-instruct (免费额度)
    # - mistralai/mixtral-8x7b-instruct-v0.1 (免费额度)
    url: ${AI_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
    key: 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
    model: ${AI_API_MODEL:meta/llama3.1-8b-instruct}
    embedding-model: ${AI_EMBEDDING_MODEL:nvidia/nv-embedqa-e5-v5}
  agent:
    # Agent 编排配置
    max-iterations: 8          # 最大工具调用轮数
    timeout-seconds: 120       # 超时时间
    temperature: 0.1           # 工具调用时使用低温度确保可靠性
    max-tokens: 2048           # 单次响应最大 token 数

fisco:
  network:
    peers:
      - "127.0.0.1:20200"
  cryptoMaterial:
    certPath: "conf"
  account:
    keyPath: "conf"
    accountAddress: ""
  contract:
    evidenceAddress: ""

file:
  upload-dir: uploads

server:
  port: 8080

logging:
  file:
    name: backend.log
  level:
    root: INFO
    com.cloudbridge: DEBUG
    org.neo4j: OFF
    org.springframework.data.neo4j: OFF
