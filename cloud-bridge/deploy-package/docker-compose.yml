version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-bridge-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/cloud_bridge;DB_CLOSE_DELAY=-1
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      - DATA_DIR=/app/data
      - SERVER_PORT=8080
      - AI_API_URL=https://api.deepseek.com/v1/chat/completions
      - AI_API_KEY=sk-efee8ad585a947a6a95effe15c71b799
      - AI_API_MODEL=deepseek-v4-flash
      - AI_AGENT_MODEL=deepseek-v4-flash
      - AI_EMBEDDING_URL=https://api.deepseek.com/v1/embeddings
      - AI_EMBEDDING_KEY=sk-efee8ad585a947a6a95effe15c71b799
      - AI_EMBEDDING_MODEL=deepseek-v4-flash
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - cloud-bridge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-bridge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8080
    networks:
      - cloud-bridge-network

networks:
  cloud-bridge-network:
    driver: bridge

volumes:
  backend-data: